[build]
  # Build from the repository root. This overrides the Base directory field in Netlify's site settings.
  base = "."
  command = "python3 scripts/build_frontend.py"
  publish = "dist"

# The backend on Render. Its ALLOWED_ORIGINS setting must include this site's URL (https://calocale.netlify.app).
[context.production.environment]
  API_BASE_URL = "https://caloriecalendar-v0-1-1.onrender.com"
