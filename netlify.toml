[build]
  command = "python3 scripts/build_frontend.py"
  publish = "dist"

# The backend's URL. Replace it with the Render URL (like https://your-service.onrender.com) once the backend
# is deployed. backend.invalid is a reserved name that never resolves, so until then the page can't send
# anything anywhere.
[context.production.environment]
  API_BASE_URL = "https://backend.invalid"
